name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/entertainment-software-ideas-nvm3h5
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages 偶尔会把某次部署卡在 queued/in_progress 上不结束，之后所有部署都会被
      # "due to in progress deployment. Please cancel <sha> first" 挡掉，重跑和手动
      # 触发都救不回来。这里先把近期还没结束的部署取消掉，让本次部署能建起来。
      - name: 取消卡住的历史 Pages 部署
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CUR: ${{ github.sha }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          shas=$(api "https://api.github.com/repos/$REPO/commits?sha=${GITHUB_REF_NAME}&per_page=10" | jq -r '.[].sha')
          for sha in $shas; do
            [ "$sha" = "$CUR" ] && continue
            st=$(api "https://api.github.com/repos/$REPO/pages/deployments/$sha" | jq -r '.status // empty')
            case "$st" in
              *queued*|*in_progress*|*building*|*pending*)
                echo "取消卡住的部署 $sha (status=$st)"
                api -X POST "https://api.github.com/repos/$REPO/pages/deployments/$sha/cancel" || true
                ;;
            esac
          done

      - id: deployment
        uses: actions/deploy-pages@v4
