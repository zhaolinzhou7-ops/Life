:root {
  --bg: #f4f5f7;
  --card: #ffffff;
  --text: #1f2328;
  --sub: #59636e;
  --line: #e3e6ea;
  --green: #1a7f37;
  --green-bg: #dafbe1;
  --red: #cf222e;
  --red-bg: #ffebe9;
  --amber: #9a6700;
  --amber-bg: #fff8c5;
  --gray: #8c959f;
  --gray-bg: #eef0f2;
  --tabbar-h: 56px;
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111315;
    --card: #1c1f23;
    --text: #e6e8eb;
    --sub: #9aa4ae;
    --line: #2d3238;
    --green: #3fb950;
    --green-bg: #12261a;
    --red: #f85149;
    --red-bg: #2d1416;
    --amber: #d29922;
    --amber-bg: #2b2111;
    --gray: #6e7681;
    --gray-bg: #23272c;
  }
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 17px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  -webkit-tap-highlight-color: transparent;
}

button, input, select, textarea { font: inherit; font-size: max(16px, 1em); color: inherit; }

a { color: var(--green); }

/* 顶部：标题 + 右上角按钮 */
.top {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 52px;
  padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}

.top h1 { margin: 0; font-size: 22px; font-weight: 600; }

.top-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 64px;
  min-height: 48px;
  padding: 0 8px;
  border: 0;
  background: none;
  color: var(--green);
  font-size: 17px;
  text-decoration: none;
  cursor: pointer;
}

.top-btn.back { justify-content: flex-start; padding-left: 0; }

/* 内容区：底部留出标签栏和 iPhone 底部横条的位置 */
.main {
  padding: 16px max(16px, env(safe-area-inset-right)) calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 24px) max(16px, env(safe-area-inset-left));
}

.main.no-tabbar { padding-bottom: calc(env(safe-area-inset-bottom) + 24px); }

.card {
  background: var(--card);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}

.sub { color: var(--sub); font-size: 16px; }

.notice {
  border-radius: 12px;
  padding: 12px 16px;
  margin-bottom: 16px;
  font-size: 16px;
}
.notice-title { font-weight: 600; }
.notice ol { margin: 4px 0 0; padding-left: 1.4em; }
.notice li + li { margin-top: 4px; }
.notice.info { background: var(--green-bg); }
.notice.warn { background: var(--amber-bg); }
.notice.bad { background: var(--red-bg); color: var(--red); }

/* 底部标签栏：只有文字 */
.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 10;
  display: flex;
  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background: var(--card);
  border-top: 1px solid var(--line);
}

.tabbar[hidden] { display: none; }

.tab {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  height: var(--tabbar-h);
  color: var(--sub);
  font-size: 17px;
  text-decoration: none;
}

.tab[aria-current="page"] { color: var(--green); font-weight: 600; }

/* 有新版本时的提示条 */
.update-bar {
  position: fixed;
  left: 16px;
  right: 16px;
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 12px);
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 8px 8px 16px;
  border-radius: 12px;
  background: var(--text);
  color: var(--bg);
}

.update-bar button {
  min-height: 48px;
  padding: 0 16px;
  border: 0;
  border-radius: 8px;
  background: var(--green);
  color: #fff;
}

</style>
</head>
<body>
<div id="app"></div>
<noscript>这个工具需要开启 JavaScript 才能使用。</noscript>

/**
 * 离线缓存：第一次打开后，程序文件存进手机，以后断网也能用。
 * 有新版本时后台装好，弹出「刷新」提示条，不自动刷新，免得打断正在填的内容。
 *
 * 在页面程序之前单独启动：就算页面程序出错，也能收到修好的新版本。
 */

function showUpdateBar() {
  if (document.querySelector('.update-bar')) return;
  const bar = document.createElement('div');
  bar.className = 'update-bar';
  bar.setAttribute('role', 'status');
  const text = document.createElement('span');
  text.textContent = '新版本已准备好';
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = '刷新';
  button.addEventListener('click', () => location.reload());
  bar.append(text, button);
  document.body.appendChild(bar);
}

function setupOfflineCache() {
  if (!('serviceWorker' in navigator) || !window.isSecureContext) return;
  const sw = navigator.serviceWorker;
  const scriptURL = new URL('sw.js', location.href).href;
  // 同一个网站上还有小游戏合集的 service worker，别把它当成我们的
  const ours = () => !!sw.controller && sw.controller.scriptURL === scriptURL;
  let controlled = ours();
  sw.addEventListener('controllerchange', () => {
    // 之前已经由旧版本接管 → 这次是新版本到了
    if (controlled) showUpdateBar();
    controlled = ours();
  });
  // 每次都重新 register：已经装好时什么也不做；第一次安装失败（比如网站缓存
  // 还没刷新、网络断了）被浏览器删掉时，能重新装上
  const register = () => sw.register('sw.js', { scope: './' });
  register().catch(() => {});
  // 回到前台时检查新版本（iPhone 上主屏幕 App 可能好几天都不重新启动）
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    register()
      .then((reg) => reg.update())
      .catch(() => {});
  });
}

setupOfflineCache();

// 申请“长期保存”：手机空间紧张时，浏览器别清掉这里的数据
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().catch(() => {});
}

/**

 * 四个标签页（今天／本周／记录／规则）+ 设置页（从「今天」右上角进入，不在标签栏里）。
 * 页面用地址里 # 后面的部分切换：#today #week #records #rules #settings。

  week: { title: '本周', stage: 3 },
  records: { title: '记录', stage: 4 },
  rules: { title: '规则', stage: 5 },
  settings: { title: '设置', stage: 5, parent: 'today' },

/** 建一个元素：h('div', {class: 'card', text: '…'}, [子元素…]) */
function h(tag, props, children) {
  const el = document.createElement(tag);
  for (const key in props || {}) {
    const value = props[key];
    if (value == null || value === false) continue;
    if (key === 'class') el.className = value;
    else if (key === 'text') el.textContent = value;
    else if (key.slice(0, 2) === 'on') el.addEventListener(key.slice(2), value);

  for (const child of children || []) {
    if (child == null || child === false) continue;
    el.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
  }
  return el;
}

function clear(el) {
  while (el.firstChild) el.removeChild(el.firstChild);

function openingHints() {

      kind: 'warn',
      title: '你是在微信里打开的',

        '往下滑，点「添加到主屏幕」（没看到就先点「查看更多」）。',
        '有“网页 App”之类的开关就保持打开，然后点「添加」。',
        '马上从主屏幕图标打开一次（这时要联网）。以后只从主屏幕图标打开——Safari 里和主屏幕里的数据是分开存的。不要在无痕浏览里用。',

/** 浏览器版本，例如“Safari 18.5”（排查问题用） */
